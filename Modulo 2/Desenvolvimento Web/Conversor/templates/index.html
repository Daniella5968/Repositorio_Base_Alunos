<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f4f4f4;
        }
        .result {
            font-size: 20px;
            margin-top: 20px;
            color: #2c3e50;
        }
        .error {
            color: red;
            font-size: 18px;
        }
        input[type="number"] {
            padding: 10px;
            width: 100%;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Currency Converter (BRL to USD)</h1>

        <form method="GET" action="/">
            <label for="valor1">Enter amount in BRL:</label>
            <input type="number" name="valor1" id="valor1" step="0.01" value="{{ valor1 }}" required>
            <button type="submit">Convert</button>
        </form>

        {% if resultado is not none %}
            <div class="result">
                <h2>Conversion Result</h2>
                <p>{{ valor1 }} BRL = {{ resultado }} USD</p>
            </div>
        {% endif %}
        
        {% if valor1 == 0 %}
            <div class="error">
                <p>Please enter a valid value to convert!</p>
            </div>
        {% endif %}

    </div>

</body>
</html>
